<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="880" height="620" font-family="Georgia, 'Newsreader', serif">
  <rect width="880" height="620" fill="#f6f2e9"/>
  <text x="40" y="40" font-size="20" fill="#23201b" font-style="italic">Four curves and two grids on the surface</text>
  <line x1="40" y1="54" x2="840" y2="54" stroke="#23201b" stroke-width="1.3"/>

  <!-- constant grids: 2 sets -->
  <g stroke="#9a3324" stroke-width="1.5" opacity="0.55">
    <line x1="120" y1="80" x2="120" y2="500"/><line x1="225" y1="80" x2="225" y2="500"/>
    <line x1="330" y1="80" x2="330" y2="500"/><line x1="435" y1="80" x2="435" y2="500"/>
    <line x1="540" y1="80" x2="540" y2="500"/></g>
  <g stroke="#345a9e" stroke-width="1.5" opacity="0.55">
    <line x1="120" y1="500" x2="540" y2="500"/><line x1="120" y1="395" x2="540" y2="395"/>
    <line x1="120" y1="290" x2="540" y2="290"/><line x1="120" y1="185" x2="540" y2="185"/>
    <line x1="120" y1="80" x2="540" y2="80"/></g>

  <!-- slope +1 : y=x, y=-x -->
  <line x1="120" y1="500" x2="540" y2="80" stroke="#23201b" stroke-width="2.4"/>
  <g stroke="#23201b" stroke-width="2.4" stroke-dasharray="1 0" opacity="0.55">
    <line x1="120" y1="290" x2="330" y2="80"/><line x1="330" y1="500" x2="540" y2="290"/></g>

  <!-- slope -1 : y=1/x, y=-1/x -->
  <line x1="120" y1="80" x2="540" y2="500" stroke="#7a6a2a" stroke-width="2.4" stroke-dasharray="9 5"/>
  <g stroke="#7a6a2a" stroke-width="2.4" stroke-dasharray="9 5" opacity="0.6">
    <line x1="120" y1="290" x2="330" y2="500"/><line x1="330" y1="80" x2="540" y2="290"/></g>

  <rect x="120" y="80" width="420" height="420" fill="none" stroke="#23201b" stroke-width="1.8"/>

  <!-- fixed / cycle points -->
  <g fill="#23201b">
    <circle cx="120" cy="500" r="5.5"/><circle cx="540" cy="80" r="5.5"/><circle cx="330" cy="290" r="5.5"/></g>
  <g fill="none" stroke="#23201b" stroke-width="2.2">
    <circle cx="225" cy="395" r="6"/><circle cx="435" cy="185" r="6"/></g>

  <!-- axis labels -->
  <g font-size="17" fill="#9a3324" text-anchor="middle">
    <text x="120" y="524">1</text><text x="225" y="524">0</text><text x="330" y="524">&#8722;1</text>
    <text x="435" y="524">&#969;</text><text x="540" y="524">1</text></g>
  <g font-size="17" fill="#345a9e" text-anchor="end">
    <text x="108" y="506">1</text><text x="108" y="401">0</text><text x="108" y="296">&#8722;1</text>
    <text x="108" y="191">&#969;</text><text x="108" y="86">1</text></g>
  <text x="330" y="551" font-size="13" fill="#6b6455" text-anchor="middle" font-style="italic">x &#183; quarter turns, edges identified</text>
  <text x="62" y="290" font-size="13" fill="#6b6455" text-anchor="middle" font-style="italic" transform="rotate(-90 62 290)">y</text>

  <!-- legend -->
  <g font-size="15" fill="#23201b">
    <line x1="600" y1="100" x2="646" y2="100" stroke="#23201b" stroke-width="2.4"/>
    <text x="658" y="105">y = x</text>
    <line x1="600" y1="132" x2="646" y2="132" stroke="#23201b" stroke-width="2.4" opacity="0.55"/>
    <text x="658" y="137">y = &#8722;x</text>
    <line x1="600" y1="164" x2="646" y2="164" stroke="#7a6a2a" stroke-width="2.4" stroke-dasharray="9 5"/>
    <text x="658" y="169">y = 1/x</text>
    <line x1="600" y1="196" x2="646" y2="196" stroke="#7a6a2a" stroke-width="2.4" stroke-dasharray="9 5" opacity="0.6"/>
    <text x="658" y="201">y = &#8722;1/x</text>
    <line x1="600" y1="232" x2="646" y2="232" stroke="#9a3324" stroke-width="1.5" opacity="0.55"/>
    <text x="658" y="237">x = const</text>
    <line x1="600" y1="264" x2="646" y2="264" stroke="#345a9e" stroke-width="1.5" opacity="0.55"/>
    <text x="658" y="269">y = const</text>
  </g>
  <g font-size="13.5" fill="#6b6455">
    <circle cx="608" cy="312" r="5" fill="#23201b"/>
    <text x="624" y="317">fixed by 1/x &#8212; {1, &#8722;1}</text>
    <circle cx="608" cy="342" r="5.5" fill="none" stroke="#23201b" stroke-width="2"/>
    <text x="624" y="347">x&#178; = &#8722;1 &#8212; {0, &#969;}</text>
  </g>

  <text x="120" y="588" font-size="14" fill="#23201b">Two grids: the constants (axis-aligned) and the four functions (slope &#177;1). The functions meet</text>
  <text x="120" y="608" font-size="14" fill="#23201b">the diagonal exactly at &#963;&#8217;s fixed points and at its 2-cycle &#8212; nowhere else.</text>
</svg>
