.pontif-plot .label{paint-order:stroke;stroke:#0a0c10;stroke-width:2.5px;stroke-linejoin:round}
.pontif-plot .enclosure-band{fill:var(--pontif-enclosure);opacity:0.16;stroke:none;display:none}
</style>
